openapi: 3.0.3
info:
  title: Payment Service
  version: 1.0.0
paths:
  /balance:
    get:
      operationId: getBalance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
  /pay:
    post:
      operationId: processPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Успешная оплата
        '400':
          description: Недостаточно средств
components:
  schemas:
    BalanceResponse:
      type: object
      properties:
        amount:
          type: integer
          format: int64
    PaymentRequest:
      type: object
      properties:
        amount:
          type: integer
          format: int64