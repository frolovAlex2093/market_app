spring.application.name=my-market-app-test
spring.r2dbc.url=r2dbc:h2:mem:///marketdb;DB_CLOSE_DELAY=-1
spring.sql.init.mode=always


spring.security.oauth2.client.provider.market-app-client.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.security.oauth2.client.provider.market-app-client.token-uri=http://localhost:9000/oauth2/token

spring.security.oauth2.client.registration.market-app-client.client-id=market-app
spring.security.oauth2.client.registration.market-app-client.client-secret=market-secret
spring.security.oauth2.client.registration.market-app-client.authorization-grant-type=client_credentials