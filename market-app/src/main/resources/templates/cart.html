<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Корзина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2><span class="badge text-bg-success">Моя Корзина</span></h2>
                <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-danger">Выход</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Список товаров в корзине -->
    <div class="row p-2" th:each="item : ${items}">
        <div class="col-12 mb-3">
            <div class="card">
                <div class="row g-0">
                    <div class="col-md-2">
                        <img th:src="${'/'+item.imgPath()}" class="img-fluid rounded-start p-2" alt="...">
                    </div>
                    <div class="col-md-10">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${item.title()}"></h5>
                            <p class="text-success fw-bold" th:text="${item.price()}+' руб.'"></p>
                            <form th:action="@{/cart/items}" method="post">
                                <div class="hstack gap-3">
                                    <input type="hidden" name="id" th:value="${item.id()}">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" name="action"
                                            value="MINUS">-
                                    </button>
                                    <span th:text="${item.count()}"></span>
                                    <button type="submit" class="btn btn-sm btn-outline-secondary" name="action"
                                            value="PLUS">+
                                    </button>
                                    <button type="submit" class="btn btn-sm btn-danger ms-auto bi bi-trash"
                                            name="action" value="DELETE"></button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Оформление заказа -->
    <div class="row p-2" th:if="${!items.isEmpty()}">
        <div class="col">
            <div th:if="${!paymentAvailable}" class="alert alert-danger">
                Сервис платежей недоступен. Оформление заказа временно невозможно.
            </div>
            <div th:if="${paymentAvailable && insufficientFunds}" class="alert alert-warning">
                На вашем счете недостаточно средств для оплаты.
            </div>

            <form th:action="@{/orders/buy}" method="post">
                <div class="hstack gap-3 p-3 bg-white border rounded shadow-sm">
                    <h2 th:text="'Итого: '+${total}+' руб.'"></h2>
                    <button class="btn btn-warning btn-lg ms-auto"
                            th:disabled="${!paymentAvailable || insufficientFunds}">
                        Оформить заказ
                    </button>
                </div>
            </form>
        </div>
    </div>
    <div class="row p-5 text-center" th:if="${items.isEmpty()}">
        <div class="col">
            <h3>Ваша корзина пуста</h3>
            <a href="/items" class="btn btn-primary mt-3">Перейти к покупкам</a>
        </div>
    </div>
</div>
</body>
</html>
