<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Мои заказы - Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">История заказов</span>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-3 ms-auto">
                    <span class="text-muted">Пользователь: <b sec:authentication="name"></b></span>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> На главную</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${orders.isEmpty()}" class="row p-5 text-center">
        <div class="col">
            <i class="bi bi- bag-x display-1 text-muted"></i>
            <h3 class="mt-3">Вы еще ничего не заказывали</h3>
            <a href="/items" class="btn btn-primary mt-3">Исправить это!</a>
        </div>
    </div>

    <div class="row p-2" th:each="order : ${orders}">
        <div class="col-12 mb-3">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <div class="hstack gap-3">
                        <h5 class="mb-0">
                            <a th:text="${'Заказ №' + order.id()}" th:href="@{'/orders/' + order.id()}"
                               class="text-decoration-none"></a>
                        </h5>
                        <span class="ms-auto text-muted small">Обработан</span>
                    </div>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item" th:each="item : ${order.items()}">
                        <div class="hstack gap-3">
                            <span th:text="${item.title()}"></span>
                            <span class="ms-auto" th:text="${item.count() + ' шт. × ' + item.price() + ' руб.'}"></span>
                        </div>
                    </li>
                </ul>
                <div class="card-footer bg-light">
                    <div class="hstack gap-3">
                        <span class="fw-bold">Итоговая сумма:</span>
                        <span class="ms-auto fw-bold text-success" th:text="${order.totalSum() + ' руб.'}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
