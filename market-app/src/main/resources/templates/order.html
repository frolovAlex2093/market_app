<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <title>Детали заказа - Витрина магазина</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="alert alert-success alert-dismissible fade show mb-0" role="alert" th:if="${newOrder}">
    <div class="container text-center">
        <i class="bi bi-check-circle-fill me-2"></i>
        <strong>Поздравляем!</strong> Ваш заказ успешно оформлен и оплачен. &#128578;
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">Детали заказа</span>
                </h2>
                <div sec:authorize="isAuthenticated()" class="hstack gap-3 ms-auto">
                    <a href="/orders" class="btn btn-secondary bi bi-file-earmark-text"> Все заказы</a>
                    <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                    <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> На главную</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-danger">Выйти</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row p-2">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow">
                <div class="card-header bg-primary text-white p-3">
                    <h3 class="mb-0 text-center" th:text="${'Заказ № ' + order.id()}"></h3>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">Наименование</th>
                            <th class="text-center">Кол-во</th>
                            <th class="text-end pe-4">Цена</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${order.items()}">
                            <td class="ps-4" th:text="${item.title()}"></td>
                            <td class="text-center" th:text="${item.count() + ' шт.'}"></td>
                            <td class="text-end pe-4" th:text="${item.price() + ' руб.'}"></td>
                        </tr>
                        </tbody>
                        <tfoot class="table-light">
                        <tr>
                            <td colspan="2" class="ps-4 fw-bold fs-4">Итоговая стоимость:</td>
                            <td class="text-end pe-4 fw-bold fs-4 text-success"
                                th:text="${order.totalSum() + ' руб.'}"></td>
                        </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="card-footer text-center p-3">
                    <button onclick="window.print()" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-printer"></i> Распечатать чек
                    </button>
                </div>
            </div>

            <div class="mt-4 text-center">
                <a href="/items" class="btn btn-link text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Вернуться к покупкам
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
