<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Ошибка - Мой Магазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="display-1 text-danger mb-4">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h2 class="mb-3">Упс! Что-то пошло не так</h2>
                    <p class="lead text-muted" th:text="${errorMessage}">Описание ошибки.</p>
                    <hr>
                    <div class="d-grid gap-2">
                        <a href="/items" class="btn btn-primary btn-lg">
                            <i class="bi bi-house-door"></i> Вернуться на главную
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            Назад
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
